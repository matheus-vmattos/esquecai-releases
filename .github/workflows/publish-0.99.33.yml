name: Publish EsquecAI 0.99.33
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-0.99.33.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: '0.99.33'
      SOURCE_REPO: 'matheus-vmattos/esquecAI'
      SOURCE_SHA: 'eef1a34988e254791f3a360972952092346dcd54'
      ARTIFACT_ID: '11481966013'
      ARTIFACT_SHA256: 'f4adcde5b71e6cfe5b23795956b6499f88462b379909c39f015ddcb08a1d6649'
      TAR_SHA256: '1c0af19a799d25a4d772e9ad187708d3a18fcbd0323c3c933edb851836b52b78'
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble validated Windows package
        run: |
          # o token deste repositório não lê artefatos do esquecAI: o pacote
          # validado (artefato $ARTIFACT_ID, zip sha256 $ARTIFACT_SHA256) veio
          # num ramo temporário, em pedaços, e é conferido aqui
          git fetch --depth 1 origin transfer-0.99.33
          mkdir package
          git archive FETCH_HEAD | tar -x -C package
          cat package/pacote.tar.part-* > pacote.tar
          echo "$TAR_SHA256  pacote.tar" | sha256sum --check
          tar -xf pacote.tar -C package
          test -s "package/esquecai-$VERSION-setup.exe"
          test -s "package/esquecai-$VERSION-setup.exe.blockmap"
          test -s package/latest.yml
          test -s package/windows-validation.json
          python3 - <<'PY'
          import base64, hashlib, json, os
          v = os.environ['VERSION']
          val = json.load(open('package/windows-validation.json'))
          assert val['version'] == v
          assert val['sourceCommit'] == os.environ['SOURCE_SHA']
          for c in ['real-auto-update', 'synthetic-data-preserved', 'installed-version']:
              assert c in val['checks'], c
          b = open(f'package/esquecai-{v}-setup.exe', 'rb').read()
          assert len(b) == val['installerSize']
          assert hashlib.sha256(b).hexdigest() == val['installerSha256']
          assert base64.b64encode(hashlib.sha512(b).digest()).decode() == val['installerSha512']
          print('pacote confere com a validação do Windows')
          PY
      - name: Prepare absolute update feed
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          v = os.environ['VERSION']
          p = Path('package/latest.yml')
          s = p.read_text()
          filename = f'esquecai-{v}-setup.exe'
          assert s.count(filename) >= 2, 'Unexpected update manifest'
          assert f'version: {v}' in s
          url = f'https://github.com/matheus-vmattos/esquecai-releases/releases/download/v{v}/' + filename
          p.write_text(s.replace(filename, url))
          PY
      - name: Create public release
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite assets' >&2
            exit 1
          fi
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "EsquecAI $VERSION" --notes "Overlay da tarefa volta a ficar por cima do navegador e de qualquer janela: ele ficava logo abaixo da barra de tarefas do Windows e caía junto quando ela perdia o topo. Concluir mostra “concluída · Desfazer”: por 15 segundos devolve a tarefa inteira, com anexos e contas; depois, Desfazer conclusão no menu da tarefa reabre e avisa antes o que não volta. Recorrente mensal cadastrada depois do dia deste mês pergunta se a deste mês ainda falta: Ainda falta põe no Hoje, atrasada; Já está paga começa no mês que vem. Instalador validado no Windows, inclusive atualização automática e overlay por cima do Bloco de Notas e do Edge. Código-fonte: $SOURCE_REPO@$SOURCE_SHA."
          # cópia com nome fixo: o botão da página do beta aponta sempre para
          # releases/latest/download/EsquecAI-Setup.exe
          cp "package/esquecai-$VERSION-setup.exe" package/EsquecAI-Setup.exe
          gh release upload "v$VERSION" package/EsquecAI-Setup.exe --repo "$GITHUB_REPOSITORY"
          gh release upload "v$VERSION" "package/esquecai-$VERSION-setup.exe" "package/esquecai-$VERSION-setup.exe.blockmap" package/latest.yml package/windows-validation.json --repo "$GITHUB_REPOSITORY"
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false
      - name: Verify public files before promoting feed
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION"
          for file in "esquecai-$VERSION-setup.exe" "esquecai-$VERSION-setup.exe.blockmap" latest.yml EsquecAI-Setup.exe; do
            curl --fail --location --retry 8 --retry-delay 3 --retry-all-errors "$base/$file" --output "public-$file"
            test "$(sha256sum "public-$file" | cut -d' ' -f1)" = "$(sha256sum "package/$file" | cut -d' ' -f1)"
          done
          # o sha512 do feed tem de ser o do instalador público
          want="$(grep -m1 '^sha512:' package/latest.yml | cut -d' ' -f2)"
          got="$(openssl dgst -sha512 -binary "public-esquecai-$VERSION-setup.exe" | base64 -w0)"
          test "$want" = "$got"
      - name: Promote verified update feed
        run: |
          cp package/latest.yml latest.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest.yml
          git commit -m "Promote EsquecAI $VERSION update feed"
          git push origin HEAD:main
      - name: Remove temporary transfer branch
        if: always()
        run: git push origin --delete transfer-0.99.33 || true
