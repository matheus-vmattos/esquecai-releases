name: Publicar encurtador
on:
  push:
    branches: [main]
    paths: ['encurtador/**', '.github/workflows/encurtador.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: encurtador
          command: deploy
      - name: Conferir de fora
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://esquecai-link.mvmattos.workers.dev/naoexiste)
          test "$code" = 404
