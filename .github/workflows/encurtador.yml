name: Publicar encurtador
on:
  push:
    branches: [main]
    paths: ['encurtador/**', '.github/workflows/encurtador.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.149.0'
          workingDirectory: encurtador
          command: deploy
      - name: Conferir de fora
        run: |
          # a página do próprio worker (não o erro 1042 da Cloudflare)
          for i in 1 2 3 4 5 6; do
            curl -s https://esquecai-link.mvmattos.workers.dev/naoexis1 | grep -q 'EsquecAI' && exit 0
            sleep 10
          done
          exit 1
