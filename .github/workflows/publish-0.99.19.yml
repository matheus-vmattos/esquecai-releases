name: Publish EsquecAI 0.99.19
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-0.99.19.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: '0.99.19'
      SOURCE_REPO: 'matheus-vmattos/esquecAI'
      SOURCE_SHA: 'dbd6f19a4961a498d2d3c3ac2b93eb864d98fafe'
      ARTIFACT_ID: '11227620648'
      ARTIFACT_SHA256: '0703469c7bc2cf5b5b9c745c3ef678fe9d903de2c982f80c42f64823b5e972ae'
    steps:
      - uses: actions/checkout@v4
      - name: Download validated Windows artifact
        run: |
          gh api "repos/$SOURCE_REPO/actions/artifacts/$ARTIFACT_ID/zip" > package.zip
          echo "$ARTIFACT_SHA256  package.zip" | sha256sum --check
          mkdir package
          unzip -q package.zip -d package
          test -s "package/esquecai-$VERSION-setup.exe"
          test -s "package/esquecai-$VERSION-setup.exe.blockmap"
          test -s package/latest.yml
          test -s package/windows-validation.json
      - name: Prepare absolute update feed
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          v = os.environ['VERSION']
          p = Path('package/latest.yml')
          s = p.read_text()
          filename = f'esquecai-{v}-setup.exe'
          assert s.count(filename) >= 2, 'Unexpected update manifest'
          assert f'version: {v}' in s
          url = f'https://github.com/matheus-vmattos/esquecai-releases/releases/download/v{v}/' + filename
          p.write_text(s.replace(filename, url))
          PY
      - name: Create public release
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite assets' >&2
            exit 1
          fi
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "EsquecAI $VERSION" --notes "Pessoas da equipe no Hoje, anexos de até 50 MB em tarefas pessoais e de equipe (sincronizados), recibos, prints que viram PDF ou tarefa, corretor de acentos e relatórios de tarefas refeitos. Instalador validado no Windows, inclusive atualização automática. Código-fonte: $SOURCE_REPO@$SOURCE_SHA."
          gh release upload "v$VERSION" "package/esquecai-$VERSION-setup.exe" "package/esquecai-$VERSION-setup.exe.blockmap" package/latest.yml package/windows-validation.json --repo "$GITHUB_REPOSITORY"
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false
      - name: Verify public files before promoting feed
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION"
          for file in "esquecai-$VERSION-setup.exe" "esquecai-$VERSION-setup.exe.blockmap" latest.yml; do
            curl --fail --location --retry 8 --retry-delay 3 --retry-all-errors "$base/$file" --output "public-$file"
            test "$(sha256sum "public-$file" | cut -d' ' -f1)" = "$(sha256sum "package/$file" | cut -d' ' -f1)"
          done
          # o sha512 do feed tem de ser o do instalador público
          want="$(grep -m1 '^sha512:' package/latest.yml | cut -d' ' -f2)"
          got="$(openssl dgst -sha512 -binary "public-esquecai-$VERSION-setup.exe" | base64 -w0)"
          test "$want" = "$got"
      - name: Promote verified update feed
        run: |
          cp package/latest.yml latest.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest.yml
          git commit -m "Promote EsquecAI $VERSION update feed"
          git push origin HEAD:main
